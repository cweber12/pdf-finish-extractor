<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="markBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A41"/>
      <stop offset="100%" stop-color="#0B1322"/>
    </linearGradient>
    <linearGradient id="swatchG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2.5" y="2.5" width="27" height="27" rx="7.2" fill="url(#markBg)" stroke="#38BDF8" stroke-width="1.25"/>

  <!-- PDF page silhouette -->
  <path d="M6.5 7.5 H13.5 L16.5 10.5 V24.5 H6.5 Z" fill="rgba(199,210,228,0.05)" stroke="#c8cdd8" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M13.5 7.5 V10.5 H16.5" stroke="#c8cdd8" stroke-width="1.25" stroke-linejoin="round"/>

  <!-- Grid lines on the page -->
  <path d="M6.5 14 H16.5" stroke="rgba(148,163,184,0.55)" stroke-width="0.9"/>
  <path d="M6.5 18.5 H16.5" stroke="rgba(148,163,184,0.55)" stroke-width="0.9"/>
  <path d="M11.5 10.5 V24.5" stroke="rgba(148,163,184,0.55)" stroke-width="0.9"/>

  <!-- Cell being extracted (highlighted on page) -->
  <rect x="11.7" y="14.2" width="4.6" height="4.1" rx="0.6" fill="url(#swatchG)" opacity="0.42"/>

  <!-- Arrow lifting the swatch out -->
  <path d="M16.7 16.3 L20.5 16.3" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M18.6 14.6 L20.6 16.3 L18.6 18" stroke="#38BDF8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Extracted swatch (popped out) -->
  <rect x="21" y="13.6" width="6" height="5.4" rx="1" fill="url(#swatchG)" filter="url(#glow)"/>
  <rect x="21" y="13.6" width="6" height="5.4" rx="1" fill="none" stroke="#7DD3FC" stroke-width="0.9" opacity="0.85"/>
</svg>
